name: vetensino-proxy

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: vetensino-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18000:80"
    expose:
      - "80"
    networks:
      - vetensino-network

networks:
  vetensino-network:
    external: true
    name: vetensino-network
